<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa em Js...</title>
    <style>
       body{
        background-color: rgb(123, 123, 219);
        color: white;  /*Comentário em CSS*/
        font: 24pt solid Arial;
        margin: 15px;
       }

       h1{
        color: rgb(235, 220, 8);
       }
    </style>
</head>
<body>
    <h1>Olá Mundo!</h1><!--Isso é um comentário em HTML-->
    <p>Começei a aprender em Js, Graças a Deus!</p>

    <script>
       var n1 = Number(window.prompt('Digite um número:'))
       var n2 = Number(window.prompt('Digite outro número:'))
       var s = n1 + n2
       window.alert(`A soma entre ${n1} e ${n2} é igual a ${s} `)
       // + serve para adição
       // + serve tbm para comcatenação

        
    </script>
</body>
</html>
